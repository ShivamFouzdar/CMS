server {
    server_name careermapsolution.com www.careermapsolution.com;

    # OLD: Served static files directly
    # root /var/www/CMS/Client;
    # index index.html;

    # NEW: Proxy to Docker Client (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API Proxy (Stays pointing to 5000, but now it hits Docker Server)
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/careermapsolution.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/careermapsolution.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.careermapsolution.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = careermapsolution.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name careermapsolution.com www.careermapsolution.com;
    return 404; # managed by Certbot
}
