name: "CMS CI Pipeline"

# Concept: Continuous Integration
# Triggered automatically on code changes.
# Ensures that every commit is valid (lints), functional (tests), and buildable (docker).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # Job 1: Quality Check & Tests
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]


    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    # Setup Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'



    # Install & Test Server
    - name: Server - Install Dependencies
      run: cd Server && npm ci

    - name: Server - Lint
      run: cd Server && npm run lint || echo "Lint warnings ignored for now"

    - name: Server - Run Tests
      # Env vars needed for tests to connect to the Matrix MongoDB
      env:
        MONGODB_URI: mongodb://localhost:27017/test_db
        JWT_SECRET: test_secret
        PORT: 5000
        ADMIN_INITIAL_EMAIL: admin@test.com
        ADMIN_INITIAL_PASSWORD: password
        SMTP_HOST: smtp.test.com
        SMTP_USER: user
        SMTP_PASS: pass
        SMTP_FROM: no-reply@test.com
        CLOUDINARY_CLOUD_NAME: test
        CLOUDINARY_API_KEY: test
        CLOUDINARY_API_SECRET: test
      run: cd Server && npm test

  # Job 2: Build Verification (Docker)
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test # Only run if tests pass

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create dummy .env for build
      run: touch Server/.env

    - name: Build Server Image
      uses: docker/build-push-action@v5
      with:
        context: ./Server
        push: false # Don't push to hub, just verify build
        tags: cms-server:test

    - name: Build Client Image
      uses: docker/build-push-action@v5
      with:
        context: ./Client
        push: false
        tags: cms-client:test
