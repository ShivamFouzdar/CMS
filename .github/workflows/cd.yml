name: "CMS CD Pipeline"

# Concept: Continuous Deployment
# Triggered automatically AFTER the 'CMS CI Pipeline' completes successfully on 'main'.
# It logs into the AWS server via SSH and runs the update script.

on:
  workflow_run:
    workflows: ["CMS CI Pipeline"]
    branches: ["main"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            # Navigate to project (Update this path if you move the folder)
            cd /home/ubuntu/new/CMS
            
            # Pull latest changes (The script does this too, but good to ensure script itself is verified)
            git pull origin main
            
            # Make sure script is executable
            chmod +x deploy-docker.sh
            
            # Run the deployment script
            ./deploy-docker.sh
